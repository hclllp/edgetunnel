# 工作流 A：混淆并暂存 worker
# 触发条件：向 alpha 分支推送（git push origin alpha）
# 1. 使用开源混淆器 javascript-obfuscator，按 obfuscation_rules.json 规则混淆 _worker.js
#    （规则含字典替换 identifierNamesGenerator=dictionary 与字符串切割 splitStrings）
# 2. 将 Genesis.txt（在前）与混淆后的代码（在后）合并为 _worker_obfus.js
# 3. 提交到 generate_obfus 远程分支（force push，保持单提交）
name: Obfuscate and Stage Worker

on:
  push:
    branches: [alpha]

permissions:
  contents: write

concurrency:
  group: obfuscate-alpha
  cancel-in-progress: false

jobs:
  obfuscate-and-stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alpha
        uses: actions/checkout@v4
        with:
          ref: alpha
          # 关键：用 PAT 检出并持久化凭证。actions/checkout 会缓存 GITHUB_TOKEN 凭证，
          # 仅靠 git remote set-url 推送仍会以 GITHUB_TOKEN 身份执行（不会触发工作流 B）。
          # 未配置 OBFUS_PUSH_TOKEN 时回退 GITHUB_TOKEN（generate_obfus 仍更新，但不触发部署）。
          token: ${{ secrets.OBFUS_PUSH_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obfuscate with javascript-obfuscator
        run: |
          npx --yes javascript-obfuscator _worker.js \
            --output obfuscated.js \
            --config obfuscation_rules.json

      - name: Merge Genesis + obfuscated code
        run: |
          cp Genesis.txt _worker_obfus.js
          printf '\n' >> _worker_obfus.js
          cat obfuscated.js >> _worker_obfus.js

      - name: Syntax check (ESM)
        run: node --input-type=module --check < _worker_obfus.js

      - name: Commit and push to generate_obfus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force _worker_obfus.js
          git commit -m "chore: regenerate obfuscated worker from alpha @ ${{ github.sha }}"
          git push --force origin HEAD:generate_obfus
