# 工作流 B：部署 worker 到 Cloudflare
# 触发条件（任一）：
#   - generate_obfus 远程分支有新的提交（人工或其他来源推送）
#   - 工作流 A（Obfuscate and Stage Worker）成功执行完毕
#     （工作流 A 使用 GITHUB_TOKEN 推送 generate_obfus 不会触发 push 事件，
#       因此必须通过 workflow_run 联动）
# 流程：
#   1. 读取 cloudflare_accounts.json 明文配置，得到每个 cloudflare 账户对应的
#      GitHub environment 名称（即 secrets 索引）
#   2. 每个账户一个矩阵任务，通过 environment 读取对应账户的私密环境变量
#   3. scripts/deploy_cloudflare.sh 负责：新建/更新实例、设置 uuid/admin 密钥、
#      KV 命名空间绑定（binding 名 KV）、绑定自定义域名（均幂等）
#   4. 打印 worker 访问链接
name: Deploy Worker to Cloudflare

on:
  push:
    branches: [generate_obfus]
  workflow_run:
    workflows: ["Obfuscate and Stage Worker"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  read-accounts:
    runs-on: ubuntu-latest
    outputs:
      accounts: ${{ steps.config.outputs.accounts }}
    steps:
      - name: Checkout generate_obfus
        uses: actions/checkout@v4
        with:
          ref: generate_obfus
      - name: Read cloudflare_accounts.json
        id: config
        run: |
          ACCOUNTS=$(python3 - <<'EOF'
          import json
          cfg = json.load(open('cloudflare_accounts.json', encoding='utf-8'))
          print(json.dumps(cfg['accounts'], ensure_ascii=False))
          EOF
          )
          echo "accounts=$ACCOUNTS" >> "$GITHUB_OUTPUT"

  deploy:
    needs: read-accounts
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.account.environment }}
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.read-accounts.outputs.accounts) }}
    steps:
      - name: Checkout generate_obfus
        uses: actions/checkout@v4
        with:
          ref: generate_obfus

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install --global wrangler

      - name: Deploy to Cloudflare (${{ matrix.account.account_name }})
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_INSTANCE_NAME: ${{ secrets.CLOUDFLARE_INSTANCE_NAME }}
          UUID: ${{ secrets.UUID }}
          PASSWORD: ${{ secrets.PASSWORD }}
          CLOUDFLARE_DOMAIN: ${{ secrets.CLOUDFLARE_DOMAIN }}
        run: bash scripts/deploy_cloudflare.sh
